name: Build unsigned iOS IPA (Sonance)

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      scheme:
        description: "Xcode scheme to build (leave blank to auto-detect the app scheme)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: Sonance
  COCOAPODS_DISABLE_STATS: "true"

jobs:
  build:
    name: Build sideloadable IPA
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select latest stable Xcode toolchain (Swift 6.2+)
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode_*.app 2>/dev/null || true
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -v -i 'beta' | grep -v -i 'preview' | sort -V | tail -n 1)
          if [ -n "$LATEST_XCODE" ]; then
            echo "Selecting Xcode: $LATEST_XCODE"
            sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          else
            echo "No versioned Xcode_*.app found, keeping the runner default."
          fi
          xcodebuild -version
          swift --version

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci --legacy-peer-deps

      - name: Apply Swift compatibility patches
        run: node scripts/patch-expo-modules-jsi.js

      - name: Generate the iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Configure Expo.plist for Over-The-Air updates
        run: node scripts/patch-expo-plist.js

      - name: Inject Podfile build settings for Swift concurrency
        run: node scripts/patch-podfile.js

      - name: Ensure JSI patches applied
        run: node scripts/patch-expo-modules-jsi.js

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('package-lock.json', 'ios/Podfile', 'scripts/patch-podfile.js') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install CocoaPods dependencies
        run: |
          if [ -f ios/Podfile ]; then
            pod install --project-directory=ios
          else
            echo "No Podfile found in ios/, skipping pod install."
          fi

      - name: Re-apply Swift interface patches to installed Pods
        run: node scripts/patch-expo-modules-jsi.js

      - name: Pre-build ExpoModulesJSI xcframework
        run: |
          echo "Building ExpoModulesJSI xcframework explicitly..."
          cd node_modules/expo-modules-jsi/apple
          PODS_ROOT="$GITHUB_WORKSPACE/ios/Pods" bash scripts/build-xcframework.sh --clean
          cd "$GITHUB_WORKSPACE"
          
          echo "Syncing built xcframework into ios/Pods and build intermediates..."
          mkdir -p ios/Pods/ExpoModulesJSI/ExpoModulesJSI.xcframework
          cp -R node_modules/expo-modules-jsi/apple/Products/ExpoModulesJSI.xcframework/* ios/Pods/ExpoModulesJSI/ExpoModulesJSI.xcframework/
          
          mkdir -p ios/Pods/ExpoModulesJSI/Products/ExpoModulesJSI.xcframework
          cp -R node_modules/expo-modules-jsi/apple/Products/ExpoModulesJSI.xcframework/* ios/Pods/ExpoModulesJSI/Products/ExpoModulesJSI.xcframework/

          mkdir -p build/Build/Products/Release-iphoneos/XCFrameworkIntermediates/ExpoModulesJSI
          cp -R node_modules/expo-modules-jsi/apple/Products/ExpoModulesJSI.xcframework/ios-arm64/ExpoModulesJSI.framework build/Build/Products/Release-iphoneos/XCFrameworkIntermediates/ExpoModulesJSI/

          mkdir -p build/Build/Products/Release-iphoneos/ExpoModulesJSI
          cp -R node_modules/expo-modules-jsi/apple/Products/ExpoModulesJSI.xcframework/ios-arm64/ExpoModulesJSI.framework build/Build/Products/Release-iphoneos/ExpoModulesJSI/

          mkdir -p ios/Pods/ExpoModulesCore/ExpoModulesCore.xcframework/ios-arm64/ExpoModulesCore.framework/Frameworks
          cp -R node_modules/expo-modules-jsi/apple/Products/ExpoModulesJSI.xcframework/ios-arm64/ExpoModulesJSI.framework ios/Pods/ExpoModulesCore/ExpoModulesCore.xcframework/ios-arm64/ExpoModulesCore.framework/Frameworks/ 2>/dev/null || true

          echo "✓ Successfully prepared ExpoModulesJSI XCFramework artifacts across all pod and intermediate directories"

      - name: Apply swiftinterface & xcconfig patches to Pods and intermediates
        run: node scripts/patch-expo-modules-jsi.js


      - name: Resolve Xcode scheme and target paths
        shell: bash
        env:
          SCHEME_OVERRIDE: ${{ inputs.scheme }}
        run: |
          set -euo pipefail

          workspace="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          if [ -z "$workspace" ]; then
            echo "ERROR: No .xcworkspace found in ios/"
            exit 1
          fi
          echo "WORKSPACE=$workspace" >> "$GITHUB_ENV"

          proj_name="$(basename "$(find ios -maxdepth 1 -name '*.xcodeproj' -print -quit)" .xcodeproj)"
          echo "PROJ_NAME=$proj_name" >> "$GITHUB_ENV"

          if [ -n "${SCHEME_OVERRIDE:-}" ]; then
            scheme="$SCHEME_OVERRIDE"
          else
            schemes="$(xcodebuild -list -workspace "$workspace" 2>/dev/null | awk '/Schemes:/{flag=1; next} flag && NF {sub(/^[ \t]+/, ""); print}')"
            echo "Available workspace schemes:"
            echo "$schemes"
            
            if echo "$schemes" | grep -qx "$proj_name"; then
              scheme="$proj_name"
            else
              scheme="$(echo "$schemes" | grep -v '^Pods-' | grep -v '^Expo' | head -n 1)"
            fi
          fi

          if [ -z "$scheme" ]; then
            echo "ERROR: Could not resolve a valid application scheme"
            exit 1
          fi
          echo "SCHEME=$scheme" >> "$GITHUB_ENV"
          echo "Resolved application scheme: $scheme"

          build_settings="$(xcodebuild -showBuildSettings -workspace "$workspace" -scheme "$scheme" -configuration Release -sdk iphoneos -derivedDataPath build 2>/dev/null)"
          target_build_dir="$(echo "$build_settings" | awk -F ' = ' '$1 ~ /^[ \t]*TARGET_BUILD_DIR$/ {print $2; exit}')"
          wrapper_name="$(echo "$build_settings" | awk -F ' = ' '$1 ~ /^[ \t]*WRAPPER_NAME$/ {print $2; exit}')"

          if [[ "$wrapper_name" != *.app ]]; then
            echo "ERROR: Scheme '$scheme' produces '$wrapper_name' instead of a .app bundle!"
            exit 1
          fi

          app_bundle_path="${target_build_dir}/${wrapper_name}"
          echo "APP_BUNDLE_PATH=$app_bundle_path" >> "$GITHUB_ENV"
          echo "Expected .app bundle path: $app_bundle_path"

      - name: Build unsigned release application
        shell: bash
        env:
          GCC_WARN_INHIBIT_ALL_WARNINGS: YES
        run: |
          set -euo pipefail
          echo "Starting xcodebuild for scheme: $SCHEME..."

          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            SWIFT_VERSION=5.0 \
            SWIFT_STRICT_CONCURRENCY=off \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            GCC_WARN_INHIBIT_ALL_WARNINGS=YES \
            ONLY_ACTIVE_ARCH=NO \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            2>&1 | tee xcodebuild.log

      - name: Verify build output
        run: |
          if [ -d "$APP_BUNDLE_PATH" ]; then
            echo "✓ .app bundle successfully built at: $APP_BUNDLE_PATH"
            ls -lh "$APP_BUNDLE_PATH"
          else
            echo "✗ .app bundle NOT found at: $APP_BUNDLE_PATH"
            find build -name "*.app" -type d 2>/dev/null || echo "No .app found"
            exit 1
          fi

      - name: Print build errors on failure
        if: failure()
        run: |
          echo "=== XCODEBUILD ERROR SUMMARY ==="
          grep -E -C 3 "error:|fatal error:" xcodebuild.log || tail -n 200 xcodebuild.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          retention-days: 7

      - name: Package the unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          echo "Packaging application from: $APP_BUNDLE_PATH"
          rm -rf package "${APP_NAME}-unsigned.ipa"
          mkdir -p package/Payload
          cp -R "$APP_BUNDLE_PATH" package/Payload/
          (
            cd package
            zip -qry "../${APP_NAME}-unsigned.ipa" Payload
          )
          echo "Successfully created ${APP_NAME}-unsigned.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-unsigned-ipa
          path: ${{ env.APP_NAME }}-unsigned.ipa
          retention-days: 90
